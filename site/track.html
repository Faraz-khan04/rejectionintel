<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker — RejectionIntel</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('ri-theme');
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FB;--card:#FFFFFF;
  --paper:#F7F7FB;--panel:#FFFFFF;
  --ink:#0E1017;--ink-2:#3B4154;--muted:#5F6780;
  --line:#E6E8F0;--line-2:#EEF0F6;--rule:#E6E8F0;--rule-soft:#EEF0F6;

  --accent:#255C99;--accent-2:#3B7EBF;--accent-soft:#E7EFF8;--accent-ink:#1B4670;

  --t-observed:#0E8A5F;--t-strong:#255C99;--t-weak:#C4820E;--t-none:#78809A;
  --t-insufficient:#78809A;
  --bg-observed:#E3F5ED;--bg-strong:#E7EFF8;--bg-weak:#FBF1DE;--bg-none:#EDEFF4;
  --observed-bg:#E3F5ED;--strong-bg:#E7EFF8;--weak-bg:#FBF1DE;--insufficient-bg:#EDEFF4;

  --sem-strong:#0E8A5F;--sem-strong-bg:#E3F5ED;
  --sem-maybe:#C4820E;--sem-maybe-bg:#FBF1DE;
  --sem-none:#5F6780;--sem-none-bg:#EDEFF4;
  --sem-neg:#C4433F;--sem-neg-bg:#FBEAEA;

  --display:'Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;--mono:ui-monospace,monospace;
  --r:14px;--r-sm:11px;--r-md:14px;--r-lg:22px;--wrap:1160px;
  --shadow:0 1px 2px rgba(14,16,23,.04), 0 12px 28px -12px rgba(14,16,23,.10);
}
[data-theme="dark"]{
  --bg:#0A0B11;--card:#14161F;--paper:#0A0B11;--panel:#14161F;
  --ink:#F1F2F7;--ink-2:#AFB6C9;--muted:#868DA3;
  --line:#252938;--line-2:#1C1F2B;--rule:#252938;--rule-soft:#1C1F2B;

  --accent:#5AA9E6;--accent-2:#7FC0F0;--accent-soft:#122436;--accent-ink:#8DC7F2;

  --t-observed:#3FC495;--t-strong:#5AA9E6;--t-weak:#E0A93A;--t-none:#8891A6;
  --t-insufficient:#8891A6;
  --bg-observed:#10352A;--bg-strong:#122436;--bg-weak:#3A2E14;--bg-none:#1F2431;
  --observed-bg:#10352A;--strong-bg:#122436;--weak-bg:#3A2E14;--insufficient-bg:#1F2431;

  --sem-strong:#3FC495;--sem-strong-bg:#10352A;
  --sem-maybe:#E0A93A;--sem-maybe-bg:#3A2E14;
  --sem-none:#8891A6;--sem-none-bg:#1F2431;
  --sem-neg:#F0776F;--sem-neg-bg:#3A1D1D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}

/* nav shared with the rest of the product */
.nav{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--rule)}
.nav-in{display:flex;align-items:center;gap:16px;height:66px;max-width:var(--wrap);
  margin:0 auto;padding:0 26px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;
  font-size:1.04rem;letter-spacing:-.03em;text-decoration:none}
.brand-mark{width:28px;height:28px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.tabs{display:flex;gap:4px;margin-left:22px;padding:4px;border-radius:14px;
  background:var(--rule-soft)}
.tabs a{font-size:.88rem;font-weight:500;color:var(--muted);text-decoration:none;
  padding:7px 15px;border-radius:14px}
.tabs a.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(14,16,23,.12)}
.nav-right{display:flex;align-items:center;gap:14px;margin-left:auto;font-size:.85rem;color:var(--muted)}
.theme-btn{width:36px;height:36px;border-radius:14px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0}
.theme-btn svg{width:16px;height:16px}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}
[data-theme="dark"] .theme-btn .sun{display:none}

.wrap{max-width:var(--wrap);margin:0 auto;padding:28px 26px 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  flex-wrap:wrap;margin-bottom:8px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 8px}
.sub{color:var(--muted);font-size:.94rem;margin:8px 0 0;max-width:62ch}

/* add form */
.addbar{display:grid;grid-template-columns:1.1fr 1.3fr .8fr auto;gap:10px;
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:14px;margin:22px 0}
@media(max-width:900px){.addbar{grid-template-columns:1fr 1fr}}
.addbar input{padding:10px 12px;border-radius:14px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink);font-family:var(--body);font-size:.9rem;min-width:0}
.btn{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;border:0;
  font-family:var(--body);font-weight:600;font-size:.9rem;padding:10px 20px;border-radius:14px;
  cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:.85rem;color:var(--muted);margin:0 0 18px;min-height:1.2em}
.msg.err{color:var(--warn)}

/* nudge */
.nudge{background:var(--warn-bg);border-radius:14px;padding:14px 18px;margin-bottom:20px;
  font-size:.9rem;color:var(--ink-2);line-height:1.55}
.nudge b{color:var(--warn)}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:14px;
  overflow-x:auto;padding-bottom:8px}
@media(max-width:1100px){.board{grid-template-columns:repeat(6,230px)}}
.col{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:12px;min-height:180px;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:2px 4px 10px;border-bottom:1px solid var(--rule-soft);margin-bottom:10px}
.col-t{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted)}
.col-n{font-family:var(--display);font-weight:800;font-size:.95rem;color:var(--ink-2)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;
  padding:12px 13px;margin-bottom:9px;cursor:grab;position:relative}
.card:active{cursor:grabbing}
.card.drag{opacity:.4}
.card-c{font-weight:600;font-size:.9rem;letter-spacing:-.01em}
.card-r{font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.4}
.card-m{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:.72rem;color:var(--muted)}
.card-age{padding:2px 7px;border-radius:14px;background:var(--none-bg);color:var(--none)}
.card-age.old{background:var(--warn-bg);color:var(--warn)}
.card-x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);
  cursor:pointer;font-size:.9rem;line-height:1;padding:2px 4px;border-radius:5px;opacity:0}
.card:hover .card-x{opacity:1}
.card-x:hover{color:var(--warn)}
.empty{font-size:.8rem;color:var(--muted);text-align:center;padding:18px 6px;line-height:1.5}
.move{display:none;width:100%;margin-top:8px;padding:6px;border-radius:14px;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);font-size:.78rem;
  font-family:var(--body)}
@media(max-width:820px){.move{display:block}.card{cursor:default}}

</style>
<link rel="stylesheet" href="/backdrop.css">
</head>
<body>

<div class="stage" aria-hidden="true">
  <span class="par" data-rate="-0.10"><span class="au au1"></span></span>
  <span class="par" data-rate="-0.05"><span class="au au2"></span></span>
  <span class="par" data-rate="-0.15"><span class="au au3"></span></span>
  <span class="par" data-rate="-0.07"><span class="au au4"></span></span>
  <span class="par" data-rate="-0.09"><span class="orb-breathe"><span class="orb"></span><span class="orb-ring"></span></span></span>
</div>




<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 14.5h10M10 6v8.5M6.5 6h7" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </span>
      RejectionIntel
    </a>
    <div class="tabs">
      <a href="/app">Analyse</a>
      <a href="/track" class="on">Tracker</a>
      <a href="/ghost">Ghost check</a>
      <a href="/cohort">Cohort</a>
      <a href="/employers">Employers</a>
    </div>
    <div class="nav-right">
      <span id="who">Guest</span>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <div>
      <p class="eyebrow">Tracker</p>
      <h1>Where everything stands</h1>
      <p class="sub">Add jobs as you apply. Anything here feeds straight into your
        analysis — no separate spreadsheet, no import step.</p>
    </div>
    <a href="/app" style="font-size:.9rem;color:var(--accent);text-decoration:none">
      Analyse these &rarr;</a>
  </div>

  <div class="addbar">
    <input id="company" placeholder="Company" autocomplete="organization">
    <input id="role" placeholder="Job title">
    <input id="applied" type="date">
    <button class="btn" id="add" type="button">Add job</button>
  </div>
  <p class="msg" id="msg"></p>

  <div id="nudge"></div>
  <div class="board" id="board"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let BOARD = null;

(function(){
  const b = $('themeBtn');
  b.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ri-theme', next); } catch(e){}
  });
})();

fetch('/api/auth/me').then(r => r.json())
  .then(a => { $('who').textContent = a.signed_in ? a.display : 'Guest'; })
  .catch(() => {});

$('applied').value = new Date().toISOString().slice(0, 10);

function setMsg(t, err){ $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }

async function load(){
  try {
    const res = await fetch('/api/track');
    BOARD = await res.json();
    render();
  } catch (e) { setMsg("Couldn't reach the server.", true); }
}

function render(){
  const b = BOARD;
  if (!b) return;

  $('nudge').innerHTML = (b.stale && b.stale.length)
    ? `<div class="nudge"><b>${b.stale.length} application${b.stale.length > 1 ? 's have' : ' has'}
       gone quiet.</b> No reply after three weeks usually means no reply — worth moving
       them to Closed so your numbers reflect reality.</div>`
    : '';

  $('board').innerHTML = b.columns.map(col => `
    <div class="col" data-col="${col.key}">
      <div class="col-h">
        <span class="col-t">${esc(col.title)}</span>
        <span class="col-n">${col.count}</span>
      </div>
      ${(b.cards[col.key] || []).map(c => card(c, b.columns)).join('')
        || '<div class="empty">Nothing here yet</div>'}
    </div>`).join('');

  wire();
}

function card(c, columns){
  const old = c.column === 'applied' && c.days_since >= 21;
  return `
    <div class="card" draggable="true" data-id="${c.id}">
      <button class="card-x" data-del="${c.id}" aria-label="Remove">&#10005;</button>
      <div class="card-c">${esc(c.company)}</div>
      <div class="card-r">${esc(c.role)}</div>
      <div class="card-m">
        <span class="card-age${old ? ' old' : ''}">${c.days_since}d</span>
        ${c.resume_label && c.resume_label !== 'default'
          ? `<span>${esc(c.resume_label)}</span>` : ''}
      </div>
      <select class="move" data-move="${c.id}">
        ${columns.map(col => `<option value="${col.key}"${
          col.key === c.column ? ' selected' : ''}>${esc(col.title)}</option>`).join('')}
      </select>
    </div>`;
}

/* Drag and drop on desktop; a select on narrow screens, because drag-and-drop
   on touch is a reliable way to make a board unusable. */
function wire(){
  let dragged = null;

  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragged = el; el.classList.add('drag');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('drag'); dragged = null; });
  });

  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      if (dragged) move(dragged.dataset.id, col.dataset.col);
    });
  });

  document.querySelectorAll('[data-move]').forEach(sel => {
    sel.addEventListener('change', () => move(sel.dataset.move, sel.value));
  });
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => remove(btn.dataset.del));
  });
}

async function move(id, column){
  const fd = new FormData(); fd.append('column', column);
  try {
    const res = await fetch(`/api/track/${id}/move`, {method:'POST', body:fd});
    if (!res.ok) { setMsg("Couldn't move that one.", true); return; }
    setMsg('');
    await load();
  } catch (e) { setMsg("Couldn't reach the server.", true); }
}

async function remove(id){
  try {
    const res = await fetch(`/api/track/${id}`, {method:'DELETE'});
    if (!res.ok) { setMsg("Couldn't remove that one.", true); return; }
    await load();
  } catch (e) { setMsg("Couldn't reach the server.", true); }
}

$('add').addEventListener('click', async () => {
  const company = $('company').value.trim();
  const role = $('role').value.trim();
  if (!company || !role) { setMsg('Company and job title are both needed.', true); return; }

  const fd = new FormData();
  fd.append('company', company);
  fd.append('role', role);
  fd.append('applied_date', $('applied').value);

  $('add').disabled = true;
  try {
    const res = await fetch('/api/track', {method:'POST', body:fd});
    const d = await res.json();
    if (!res.ok) { setMsg(d.detail || "Couldn't add that.", true); return; }
    setMsg(d.duplicate ? 'Already tracking that one.' : `Added ${company}.`);
    $('company').value = ''; $('role').value = '';
    $('company').focus();
    await load();
  } catch (e) { setMsg("Couldn't reach the server.", true); }
  finally { $('add').disabled = false; }
});

['company','role'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });
});

load();
</script>
<script src="/backdrop.js"></script>
</body>
</html>
