<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/* Subtractive by intent: no cards, no pills, no gradient headline. Hairline
   rules and one small-caps label carry the separation, type carries the
   hierarchy. The four tier colours mean what they mean in the report —
   confidence — and are never used for decoration. */
:root{
  --bg:#0A0B11; --ink:#F1F2F7; --ink-2:#AFB6C9; --muted:#868DA3;
  --line:#20242F; --field:#0F1118;
  --accent:#8B7BFF;                 /* matches the violet-accent tag */
  --observed:#3FC495;               /* green  — a fact we hold */
  --weak:#E0A93A;                   /* amber  — needs attention */
  --insufficient:#78809A;           /* grey   — not enough data */
  --negative:#C4433F;               /* red    — failing */
}
*{box-sizing:border-box}
body{margin:0;width:360px;background:var(--bg);color:var(--ink);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{padding:18px 18px 16px}

/* connection line */
header{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--insufficient);flex:none}
.dot.on{background:var(--observed)}
.dot.warn{background:var(--weak)}

/* zones */
.zone{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px}
.headline{font-size:20px;line-height:1.25;margin:0 0 2px;letter-spacing:-.015em}
.line{margin:0 0 4px;font-size:13.5px}
.line.muted{color:var(--ink-2);font-size:12.5px}
.line.quiet{color:var(--insufficient);font-size:12.5px}

/* One stale application: the fact on the left, the action on the right. */
.stale-row{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stale-row:first-child{border-top:0}
.stale-what{font-size:13px;min-width:0}
.stale-what b{font-weight:600}
.stale-when{display:block;font-size:11.5px;color:var(--insufficient);margin-top:1px}
.stale-go{flex:none;background:none;border:1px solid var(--line);color:var(--ink-2);
  border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500;
  cursor:pointer;margin:0;width:auto}
.stale-go:hover{border-color:var(--muted);color:var(--ink)}

/* buttons */
button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:9px;
  cursor:pointer;font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif}
button.primary{background:var(--accent);color:#0A0B11}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);
  font-weight:500;margin-top:10px}
button.ghost:hover{border-color:var(--muted);color:var(--ink)}

/* advanced drawer */
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{font-size:11.5px;color:var(--muted);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"› ";color:var(--muted)}
details[open] summary::before{content:"⌄ "}
label{display:block;font-size:10.5px;color:var(--muted);margin:12px 0 5px;
  text-transform:uppercase;letter-spacing:.08em}
input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--field);color:var(--ink);font:12px ui-monospace,monospace}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--field);color:var(--ink);
  font:11.5px/1.5 ui-monospace,monospace;resize:vertical}

/* Skill gap. Counts and named skills only — the numbers come from the server
   and are rendered as sent, with no sentence built around them here. */
.gap-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:8px;margin-top:12px}
.gap-pct{font-size:20px;font-weight:650;letter-spacing:-.015em}
.gap-band{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted)}
.gap-verdict{font-size:12.5px;color:var(--ink-2);margin:4px 0 0}
.gap-list{margin:10px 0 0;padding:0;list-style:none}
.gap-list li{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.gap-list li:first-child{border-top:0}
.gap-list .need{color:var(--weak);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;margin-left:6px}
.gap-list .wks{display:block;font-size:11.5px;color:var(--insufficient);
  margin-top:1px}
.gap-note{font-size:11.5px;color:var(--insufficient);margin:10px 0 0;
  line-height:1.5}

.msg{font-size:11.5px;margin:12px 0 0;color:var(--muted);line-height:1.5}
.msg.warn{color:var(--weak)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <header><span class="dot" id="dot"></span><span id="conn">Checking…</span></header>

  <button class="primary hidden" id="connect">Connect to RejectionIntel</button>
  <p class="msg hidden" id="connNote"></p>

  <section class="zone hidden" id="jobZone">
    <p class="label">This job</p>
    <p class="headline" id="jobTitle"></p>
    <p class="line muted" id="jobCompany"></p>
    <button class="ghost" id="capture">Capture this application</button>
    <button class="ghost" id="autofill">Fill the application form</button>
    <button class="ghost" id="analyze">Check this against my resume</button>
    <div id="gap"></div>
  </section>

  <section class="zone hidden" id="cohortZone">
    <p class="label">What the data says</p>
    <p class="line" id="benchLine"></p>
    <p class="line quiet" id="employerLine"></p>
  </section>

  <section class="zone hidden" id="staleZone">
    <p class="label">Gone quiet</p>
    <p class="line" id="staleLine"></p>
    <div id="staleList"></div>
  </section>

  <section class="zone" id="queueZone">
    <p class="label">Queue</p>
    <p class="line" id="queueLine">Nothing waiting to send.</p>
    <button class="ghost hidden" id="flush">Send them now</button>
  </section>

  <details id="adv">
    <summary>Advanced</summary>
    <label for="endpoint">Server</label>
    <input id="endpoint" placeholder="http://127.0.0.1:8000">
    <label for="token">API token (only if Connect can't reach the app)</label>
    <input id="token" type="password" placeholder="paste a token">
    <label for="resume">Resume text (used for the skills check)</label>
    <textarea id="resume" rows="4" placeholder="paste your resume text"></textarea>

    <label for="profile">Autofill profile (JSON, stays on this machine)</label>
    <textarea id="profile" rows="6"
      placeholder='{"first_name":"","last_name":"","email":"","phone":"","linkedin_url":"","location":""}'></textarea>

    <button class="ghost" id="save">Save</button>
    <button class="ghost" id="disconnect">Disconnect</button>
  </details>

  <p class="msg" id="msg"></p>
</div>

<script src="popup.js"></script>
</body>
</html>
